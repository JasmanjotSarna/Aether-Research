  <!-- Typography: AETHER RESEARCH -->
  <text x="68" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="800" letter-spacing="0.08em" fill="#F8FAFC">AETHER</text>
  <text x="180" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="300" letter-spacing="0.16em" fill="#38BDF8">RESEARCH</text>

  <!-- Tagline: Think deeper. Discover further. -->
  <text x="69" y="54" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9.5" font-weight="500" letter-spacing="0.14em" fill="#94A3B8">THINK DEEPER. DISCOVER FURTHER.</text>
</svg>

